<!-- 과제 템플릿-유저 프로필 카드 -->
<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iidw-w4-assignment-template</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="./w4-assn-ex.css" />
  </head>
  <body>
    <div id="profile">
      <div class="section section-1">
        <div class="picture"></div>
        <div>
          <div class="name">홍길동</div>
          <div class="id"><a href="">@johndoe</a></div>
          <div class="wrap">
            <div class="following">
              <span class="label">팔로잉</span>
              <a href="">40</a>
            </div>
            <div class="follower">
              <span class="label">팔로워</span>
              <a href="">30</a>
            </div>
          </div>
        </div>
      </div>
      <div class="desc section section-2">
        이 편지는 영국에서 최초로 시작되어 일년에 한바퀴를 돌면서 받는 사람에게
        행운을 주었고 지금은 당신에게로 옮겨진 이 편지는 4일 안에 당신 곁을
        떠나야 합니다. 이 편지를 포함해서 7통을 행운이 필요한 사람에게 보내
        주셔야 합니다. 복사를 해도 좋습니다. 혹 미신이라 하실지 모르지만
        사실입니다.
      </div>
      <div class="section section-3">
        <div class="link">
          <span class="label">
            <span class="material-symbols-outlined">link_2</span>
          </span>
          <a href="">killdong.kr </a>
        </div>
        <div class="joined">
          <span class="label">
            <span class="material-symbols-outlined">calendar_month</span>
            <span>가입일</span>
          </span>
          <span>2011년 11월</span>
        </div>
      </div>
      <div class="section section-5">
        <div class="btn">팔로우</div>
        <div class="btn alt">메세지</div>
      </div>
    </div>
  </body>
</html>
